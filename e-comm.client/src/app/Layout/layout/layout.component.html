<div class="layout">
  <app-header 
    [sidebarCollapsed]="sidebarCollapsed"
    (toggleSidebar)="onToggleSidebar()">
  </app-header>
  <div class="content">
    <app-sidebar 
      [isCollapsed]="sidebarCollapsed"
      (toggleSidebar)="onSidebarToggle($event)">
    </app-sidebar>
    <main>
      <div class="main-content">
        <h1>Welcome to E-Sahulat Shopping Dashboard</h1>
        <p>This is your main content area. The sidebar and header are now properly configured.</p>
        <div class="dashboard-cards">
          <div class="card">
            <h3>Total Orders</h3>
            <p class="number">1,234</p>
          </div>
          <div class="card">
            <h3>Total Revenue</h3>
            <p class="number">$45,678</p>
          </div>
          <div class="card">
            <h3>Total Products</h3>
            <p class="number">567</p>
          </div>
          <div class="card">
            <h3>Total Customers</h3>
            <p class="number">890</p>
          </div>
        </div>
      </div>
      <!-- <router-outlet></router-outlet> This shows your pages -->
    </main>
  </div>
  <app-footer></app-footer>
</div>
