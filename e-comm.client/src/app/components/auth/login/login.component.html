<div class="container mt-5">
  <div class="card p-4 shadow-lg rounded">
    <h3 class="text-center">Login</h3>

    <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)">
      <!-- Email -->
      <div class="mb-3">
        <label>Email</label>
        <input type="email" 
               class="form-control"
               name="email" 
               [(ngModel)]="loginData.email"
               required
               email>
        <div *ngIf="loginForm.submitted && !loginData.email" class="text-danger">
          Email is required
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label>Password</label>
        <input type="password" 
               class="form-control"
               name="password"
               [(ngModel)]="loginData.password"
               required>
        <div *ngIf="loginForm.submitted && !loginData.password" class="text-danger">
          Password is required
        </div>
      </div>

      <!-- Terms and Conditions -->
      <div class="mb-3 form-check">
        <input type="checkbox"
               class="form-check-input"
               name="isTermsAccepted"
               [(ngModel)]="loginData.isTermsAccepted"
               required>
        <label class="form-check-label">
          I accept the <a href="#">terms and conditions</a>
        </label>
        <div *ngIf="loginForm.submitted && !loginData.isTermsAccepted" class="text-danger">
          You must accept the terms to continue
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
  </div>
</div>
